name: Release

on:
  push:
    tags: ['v*']
  # 手动触发：可只构建单个平台、指定版本号（用于重发已存在的 release）
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建哪些平台'
        type: choice
        options:
          - all
          - macos-only
          - windows-only
        default: all
      version:
        description: '目标版本号（如 v1.5.0）。推 tag 时自动取 tag 名；手动触发想更新已存在的 release 时填写'
        required: false
        default: ''

jobs:
  test:
    # 先跑测试，测试不过不放安装包
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  release-windows:
    name: Build Windows exe
    needs: test
    if: github.event_name == 'push' || inputs.platforms != 'macos-only'
    runs-on: windows-latest
    permissions:
      contents: write        # softprops/action-gh-release 创建 Release 需要
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller pystray psutil pillow
      - run: pwsh scripts/build-exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-web-tray-windows-exe
          path: dist/dsh-web-tray.exe
      - name: Remove stale exe asset (re-release)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset "${{ inputs.version }}" "dsh-web-tray.exe" --yes 2>/dev/null || true
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/dsh-web-tray.exe

  release-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    needs: test
    if: github.event_name == 'push' || inputs.platforms != 'windows-only'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write        # softprops/action-gh-release 创建 Release 需要
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # arm64 (Apple Silicon)
            arch: arm64
          - runner: macos-15-intel    # x86_64 (Intel)；macos-13 已退役，勿用
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # tkinter 向导（打包进 app 的 wizard.py 依赖）；GH Actions 的 setup-python 无 tk，用框架版 brew Python
      - run: brew install python-tk
      - run: pip3 install pyinstaller pystray psutil pillow
      - name: Build app + DMG
        run: bash scripts/build-app.sh
      - name: Rename DMG with arch and version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        run: |
          mv "dsh-web-tray-$(uname -m).dmg" \
             "dsh-web-tray-${{ matrix.arch }}-${TAG}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-web-tray-macos-${{ matrix.arch }}-dmg
          path: dsh-web-tray-*.dmg
      - name: Remove stale DMG asset (re-release)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset "${{ inputs.version }}" "dsh-web-tray-${{ matrix.arch }}-${{ inputs.version }}.dmg" --yes 2>/dev/null || true
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dsh-web-tray-${{ matrix.arch }}-${{ env.TAG }}.dmg
